server {
    listen 80;
    server_name localhost;

    # 1. 가상의 2FA (사내 인증 대체)
    auth_basic "Mock 2FA Login (Company SSO)";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        # 2. Basic Auth를 통과한 실제 사원 ID를 Audit 추적용으로 주입
        proxy_set_header X-Opaque-Id $remote_user;

        # 3. 클라이언트의 Basic Auth를 무시하고, Kibana 전용 계정 정보로 덮어씌움
        # "kibana_viewer:viewer_password"의 Base64 인코딩 값
        proxy_set_header Authorization "Basic a2liYW5hX3ZpZXdlcjp2aWV3ZXJfcGFzc3dvcmQ=";

        # 4. Kibana로 트래픽 전달
        proxy_pass http://kibana:5601;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}